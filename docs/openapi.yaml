openapi: 3.0.3
info:
  title: Verifyflow API
  version: 0.5.0
  description: |
    Public HTTP contract for the registered health, authentication, account, rental, payment,
    messaging, webhook, and admin routes. All customer request bodies are JSON. Responses include an `X-Request-ID` header.
    Access tokens are short-lived JWTs; refresh tokens are opaque, single-use tokens that rotate
    on refresh.

    Rental routes require a verified email address in addition to a valid access token. Admin
    routes require the signed-in user's role to be `admin`; every account starts as `user`.

    Twilio, Vonage, and Telnyx are supported behind a provider-neutral interface. Inbound provider
    callbacks require their vendor signature and are persisted idempotently.
servers:
  - url: /
    description: Same origin as this documentation page
tags:
  - name: Health
  - name: Authentication
  - name: Account
  - name: Rentals
  - name: Messaging
  - name: Webhooks
  - name: Admin
paths:
  /health:
    get:
      tags: [Health]
      summary: Check API and database health
      operationId: getHealth
      responses:
        '200':
          description: API and database are healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                database: ok
        '503':
          description: Database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: degraded
                database: unavailable

  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Register and sign in
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created and signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '409':
          description: Email is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: email_taken
                  message: An account with this email already exists.
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Sign in
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in; a new independent session is created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '401':
          description: Email or password is incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_credentials
                  message: Invalid email or password.
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'

  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate refresh token
      description: Exchanges a refresh token for a new access token and refresh token. Serialize refresh calls.
      operationId: refreshTokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Tokens rotated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '401':
          description: Refresh token is invalid, expired, revoked, or reused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_refresh_token
                  message: Refresh token is invalid or expired. Please sign in again.
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke a refresh-token session
      description: Idempotent. The current access token remains valid until it expires.
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Session revoked, or token was unknown or expired.
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'

  /api/v1/auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request a password-reset link
      description: Always returns the same accepted response for a well-formed email to prevent account enumeration.
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Request accepted; no account-existence information is disclosed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: If an account exists for that email, a password reset link has been sent.
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'

  /api/v1/auth/reset-password:
    post:
      tags: [Authentication]
      summary: Set a password using a reset token
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password changed; all refresh sessions are revoked.
        '400':
          description: Invalid JSON or reset token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidJson:
                  $ref: '#/components/examples/InvalidJSON'
                invalidToken:
                  value:
                    error:
                      code: invalid_reset_token
                      message: This reset link is invalid or has expired. Please request a new one.
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'

  /api/v1/auth/verify-email:
    post:
      tags: [Authentication]
      summary: Verify an email address
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '204':
          description: Email address verified.
        '400':
          description: Invalid JSON or verification token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidJson:
                  $ref: '#/components/examples/InvalidJSON'
                invalidToken:
                  value:
                    error:
                      code: invalid_verification_token
                      message: This verification link is invalid or has expired. Request a new one from your account.
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'

  /api/v1/auth/resend-verification:
    post:
      tags: [Authentication]
      summary: Request a new verification email
      operationId: resendVerification
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Email address is already verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Your email is already verified.
        '202':
          description: Verification email queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Verification email sent.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'

  /api/v1/auth/change-password:
    post:
      tags: [Authentication]
      summary: Change the signed-in user's password
      description: Revokes all refresh sessions and returns replacement tokens for this device.
      operationId: changePassword
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed; replacement tokens returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid JSON or account has no password set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidJson:
                  $ref: '#/components/examples/InvalidJSON'
                passwordNotSet:
                  value:
                    error:
                      code: password_not_set
                      message: This account has no password yet. Use "forgot password" to set one.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Concurrent password change conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: conflict
                  message: Your password was changed by another request. Please sign in again.
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'

  /api/v1/me:
    get:
      tags: [Account]
      summary: Get the authenticated user
      operationId: getMe
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Authenticated user's profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'

  /api/v1/numbers:
    get:
      tags: [Rentals]
      summary: Search available numbers
      description: Lists provider numbers currently AVAILABLE for rental, optionally filtered by type and capability.
      operationId: searchNumbers
      security:
        - BearerAuth: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [Local, TollFree, Mobile]
        - name: sms
          in: query
          description: When true, only return numbers with SMS capability.
          schema:
            type: boolean
        - name: mms
          in: query
          description: When true, only return numbers with MMS capability.
          schema:
            type: boolean
        - name: voice
          in: query
          description: When true, only return numbers with voice capability.
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: Opaque pagination cursor from a previous page's next_cursor.
          schema:
            type: string
      responses:
        '200':
          description: Page of available numbers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumbersPage'
        '400':
          description: Invalid type or limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_request
                  message: Request is missing or has invalid fields.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'

  /api/v1/rental-plans:
    get:
      tags: [Rentals]
      summary: List active rental plans
      operationId: listRentalPlans
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Active rental plans.
          content:
            application/json:
              schema:
                type: object
                required: [plans]
                properties:
                  plans:
                    type: array
                    items:
                      $ref: '#/components/schemas/Plan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'

  /api/v1/rentals:
    post:
      tags: [Rentals]
      summary: Reserve a number (checkout)
      description: |
        Reserves a provider number under a rental plan and creates a server-priced PENDING
        order. Reusing the same Idempotency-Key with the same request returns the original
        order instead of creating a new one; reusing it with a different number or plan is a
        conflict. The reservation expires after a server-configured TTL if never paid.
      operationId: reserveNumber
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReserveRequest'
      responses:
        '201':
          description: Reservation and PENDING order created (or the original order, if this Idempotency-Key was already used).
          content:
            application/json:
              schema:
                type: object
                required: [order]
                properties:
                  order:
                    $ref: '#/components/schemas/Order'
        '400':
          description: Invalid JSON, missing fields, or missing Idempotency-Key header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidJson:
                  $ref: '#/components/examples/InvalidJSON'
                missingIdempotencyKey:
                  value:
                    error:
                      code: missing_idempotency_key
                      message: Idempotency-Key header is required.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '404':
          description: The requested number was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: number_not_found
                  message: The requested number was not found.
        '409':
          description: Number/plan is no longer available, or this Idempotency-Key was already used with a different request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                numberUnavailable:
                  value:
                    error:
                      code: number_unavailable
                      message: The requested number is no longer available.
                planUnavailable:
                  value:
                    error:
                      code: plan_unavailable
                      message: The requested rental plan is unavailable.
                idempotencyConflict:
                  value:
                    error:
                      code: idempotency_conflict
                      message: This idempotency key was already used with a different request.
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'

  /api/v1/orders/{id}:
    get:
      tags: [Rentals]
      summary: Get an order owned by the signed-in user
      operationId: getOrder
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathID'
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                type: object
                required: [order]
                properties:
                  order:
                    $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '404':
          description: No such order, or it belongs to another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: not_found
                  message: The requested order was not found.
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'

  /api/v1/admin/users/{id}/role:
    patch:
      tags: [Admin]
      summary: Change another user's role
      description: |
        Admin-only. Refuses to demote the last remaining admin (returns 409 last_admin), so an
        admin can never lock every admin out of the system.
      operationId: setUserRole
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRoleRequest'
      responses:
        '200':
          description: Role updated (or unchanged, if it already matched).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          description: Invalid JSON or unknown role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidJson:
                  $ref: '#/components/examples/InvalidJSON'
                invalidRole:
                  value:
                    error:
                      code: invalid_role
                      message: 'role must be one of: user, admin.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: user_not_found
                  message: User not found.
        '409':
          description: The target is the last remaining admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: last_admin
                  message: Cannot remove the last remaining admin.
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'

  /api/v1/admin/provider-configs:
    get:
      tags: [Admin]
      summary: List provider configs
      description: Admin-only. Never returns credential plaintext or ciphertext, only metadata.
      operationId: listProviderConfigs
      security:
        - BearerAuth: []
      parameters:
        - name: kind
          in: query
          schema:
            type: string
            enum: [telephony, payment]
      responses:
        '200':
          description: Provider config metadata.
          content:
            application/json:
              schema:
                type: object
                required: [provider_configs]
                properties:
                  provider_configs:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProviderConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'
    post:
      tags: [Admin]
      summary: Create a provider config
      description: |
        Admin-only. `credentials` is an opaque JSON object (e.g. `{"account_sid": "...",
        "auth_token": "..."}` for Twilio) that is encrypted at rest with the server's current
        provider-credential key; it is never stored or returned as plaintext.
      operationId: createProviderConfig
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderConfigCreateRequest'
      responses:
        '201':
          description: Provider config created.
          content:
            application/json:
              schema:
                type: object
                required: [provider_config]
                properties:
                  provider_config:
                    $ref: '#/components/schemas/ProviderConfig'
        '400':
          description: Invalid JSON, invalid kind/key/name, or missing credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidJson:
                  $ref: '#/components/examples/InvalidJSON'
                invalidRequest:
                  value:
                    error:
                      code: invalid_request
                      message: Request is missing or has invalid fields.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A provider config with this kind, key, and name already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: duplicate_config
                  message: A provider config with this kind, key and name already exists.
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'

  /api/v1/admin/provider-configs/{id}:
    patch:
      tags: [Admin]
      summary: Enable or disable a provider config
      operationId: setProviderConfigEnabled
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderConfigEnabledRequest'
      responses:
        '200':
          description: Updated provider config.
          content:
            application/json:
              schema:
                type: object
                required: [provider_config]
                properties:
                  provider_config:
                    $ref: '#/components/schemas/ProviderConfig'
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such provider config.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: not_found
                  message: The requested provider config was not found.
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'

  /api/v1/my-numbers:
    get:
      tags: [Messaging]
      summary: List the authenticated customer's rented numbers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Customer number list.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/messages:
    get:
      tags: [Messaging]
      summary: List normalized inbound and outbound messages
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: number_id
          schema: { type: string, format: uuid }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200': { description: Paginated message list. }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Messaging]
      summary: Send an SMS from an owned active number
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_number_id, to, body]
              properties:
                provider_number_id: { type: string, format: uuid }
                to: { type: string, example: '+2348012345678' }
                body: { type: string, maxLength: 1600 }
      responses:
        '201': { description: Message accepted by the configured provider. }
        '400': { $ref: '#/components/responses/InvalidJSON' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Number is inactive or not SMS capable. }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/webhooks/telephony/{providerConfigID}/inbound:
    post:
      tags: [Webhooks]
      summary: Receive a signed inbound SMS callback
      parameters:
        - in: path
          name: providerConfigID
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Event accepted or already processed. }
        '400': { description: Malformed provider event. }
        '401': { description: Invalid provider signature. }
        '429': { $ref: '#/components/responses/RateLimited' }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PathID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [ok, unavailable]
    RegisterRequest:
      type: object
      required: [full_name, email, password]
      additionalProperties: false
      properties:
        full_name:
          type: string
          maxLength: 100
          description: Required; trimmed and must not contain control characters.
          example: Feranmi Oresajo
        email:
          type: string
          format: email
          maxLength: 254
          example: fer@example.com
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 128
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: fer@example.com
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 128
    EmailRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: fer@example.com
    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          example: kQ3...
    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      additionalProperties: false
      properties:
        token:
          type: string
        new_password:
          type: string
          format: password
          minLength: 10
          maxLength: 128
    TokenRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 10
          maxLength: 128
          description: Must differ from the current password.
    User:
      type: object
      required: [id, full_name, username, email, email_verified, role, created_at]
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        role:
          type: string
          enum: [user, admin]
        created_at:
          type: string
          format: date-time
    TokenResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: Short-lived JWT access token.
        refresh_token:
          type: string
          description: Opaque, single-use refresh token. Store the newest token after rotation.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Access-token lifetime in seconds.
          example: 900
    AuthenticationResponse:
      allOf:
        - $ref: '#/components/schemas/TokenResponse'
        - type: object
          required: [user]
          properties:
            user:
              $ref: '#/components/schemas/User'
    MeResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    SetRoleRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [user, admin]
    NumberSummary:
      type: object
      required: [id, phone_number, number_type, sms_enabled, mms_enabled, voice_enabled]
      properties:
        id:
          type: string
          format: uuid
        phone_number:
          type: string
          example: '+14155550001'
        number_type:
          type: string
          enum: [Local, TollFree, Mobile]
        sms_enabled:
          type: boolean
        mms_enabled:
          type: boolean
        voice_enabled:
          type: boolean
    NumbersPage:
      type: object
      required: [numbers]
      properties:
        numbers:
          type: array
          items:
            $ref: '#/components/schemas/NumberSummary'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; empty when there are no more results.
    Plan:
      type: object
      required: [id, code, name, duration_seconds, price_minor_units, currency]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: one-hour
        name:
          type: string
          example: One hour
        duration_seconds:
          type: integer
          example: 3600
        price_minor_units:
          type: integer
          format: int64
          description: Price in the currency's smallest unit (e.g. cents).
          example: 1299
        currency:
          type: string
          example: USD
    ReserveRequest:
      type: object
      required: [provider_number_id, rental_plan_id]
      additionalProperties: false
      properties:
        provider_number_id:
          type: string
          format: uuid
        rental_plan_id:
          type: string
          format: uuid
    Order:
      type: object
      required:
        - id
        - rental_id
        - provider_number_id
        - rental_plan_id
        - status
        - plan_code
        - plan_name
        - duration_seconds
        - price_minor_units
        - currency
        - reservation_expires_at
        - created_at
      properties:
        id:
          type: string
          format: uuid
        rental_id:
          type: string
          format: uuid
        provider_number_id:
          type: string
          format: uuid
        rental_plan_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, EXPIRED]
        plan_code:
          type: string
        plan_name:
          type: string
        duration_seconds:
          type: integer
        price_minor_units:
          type: integer
          format: int64
          description: Server-priced snapshot at reservation time; unaffected by later plan-price changes.
        currency:
          type: string
        reservation_expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    ProviderConfig:
      type: object
      required: [id, kind, key, name, is_enabled, credential_key_version, created_at, updated_at]
      description: Metadata only. Credential plaintext and ciphertext are never returned.
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [telephony, payment]
        key:
          type: string
          example: twilio
        name:
          type: string
          example: primary
        is_enabled:
          type: boolean
        credential_key_version:
          type: string
          description: Which server-side encryption key version protects this config's credentials.
          example: v1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProviderConfigCreateRequest:
      type: object
      required: [kind, key, name, credentials]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [telephony, payment]
        key:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,63}$'
          example: twilio
        name:
          type: string
          example: primary
        credentials:
          type: object
          description: Opaque provider-specific credential fields. Encrypted at rest; never echoed back.
          example:
            account_sid: AC123...
            auth_token: '********'
    ProviderConfigEnabledRequest:
      type: object
      required: [is_enabled]
      additionalProperties: false
      properties:
        is_enabled:
          type: boolean
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
  examples:
    InvalidJSON:
      value:
        error:
          code: invalid_json
          message: Request body must be valid JSON with the expected fields.
  responses:
    InvalidJSON:
      description: Malformed JSON, unknown fields, or trailing data.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: invalid_json
              message: Request body must be valid JSON with the expected fields.
    RequestTooLarge:
      description: Request body exceeds 16 KiB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: request_too_large
              message: Request body is too large.
    ValidationFailed:
      description: One or more fields failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: validation_failed
              message: One or more fields are invalid.
              fields:
                email: must be a valid email address
    RateLimited:
      description: Too many requests. Wait before retrying.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: rate_limited
              message: Too many requests. Please try again later.
    Unauthorized:
      description: Missing or invalid access token.
      headers:
        WWW-Authenticate:
          schema:
            type: string
          example: Bearer realm="migo"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: unauthorized
              message: Authentication is required.
    EmailNotVerified:
      description: The signed-in user's email address is not verified.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: email_not_verified
              message: Please verify your email address to use this feature.
    Forbidden:
      description: The signed-in user does not have the admin role required for this route.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: forbidden
              message: You do not have permission to perform this action.
    InternalError:
      description: Unexpected server error. Details are not exposed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: internal_error
              message: Something went wrong.
    Timeout:
      description: Request exceeded its deadline.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: timeout
              message: The request timed out.
