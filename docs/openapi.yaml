openapi: 3.0.3
info:
  title: Verifyflow API
  version: 0.4.0
  description: |
    Public HTTP contract for the currently registered health, authentication, and account routes.
    All request bodies are JSON. Responses include an `X-Request-ID` header. Access tokens are
    short-lived JWTs; refresh tokens are opaque, single-use tokens that rotate on refresh.

    The backend also contains internal foundations for provider-neutral telephony, a Twilio
    adapter (number search/provision/release, webhook configuration, outbound SMS, and signed
    inbound SMS normalization), and PostgreSQL rental, order, payment, and webhook-event tables.
    These capabilities are not yet exposed as public HTTP endpoints and therefore do not appear
    in this OpenAPI contract.
servers:
  - url: /
    description: Same origin as this documentation page
tags:
  - name: Health
  - name: Authentication
  - name: Account
paths:
  /health:
    get:
      tags: [Health]
      summary: Check API and database health
      operationId: getHealth
      responses:
        '200':
          description: API and database are healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                database: ok
        '503':
          description: Database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: degraded
                database: unavailable

  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Register and sign in
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created and signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '409':
          description: Email is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: email_taken
                  message: An account with this email already exists.
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Sign in
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in; a new independent session is created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '401':
          description: Email or password is incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_credentials
                  message: Invalid email or password.
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'

  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate refresh token
      description: Exchanges a refresh token for a new access token and refresh token. Serialize refresh calls.
      operationId: refreshTokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Tokens rotated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '401':
          description: Refresh token is invalid, expired, revoked, or reused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_refresh_token
                  message: Refresh token is invalid or expired. Please sign in again.
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke a refresh-token session
      description: Idempotent. The current access token remains valid until it expires.
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Session revoked, or token was unknown or expired.
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'

  /api/v1/auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request a password-reset link
      description: Always returns the same accepted response for a well-formed email to prevent account enumeration.
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Request accepted; no account-existence information is disclosed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: If an account exists for that email, a password reset link has been sent.
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'

  /api/v1/auth/reset-password:
    post:
      tags: [Authentication]
      summary: Set a password using a reset token
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password changed; all refresh sessions are revoked.
        '400':
          description: Invalid JSON or reset token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidJson:
                  $ref: '#/components/examples/InvalidJSON'
                invalidToken:
                  value:
                    error:
                      code: invalid_reset_token
                      message: This reset link is invalid or has expired. Please request a new one.
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'

  /api/v1/auth/verify-email:
    post:
      tags: [Authentication]
      summary: Verify an email address
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '204':
          description: Email address verified.
        '400':
          description: Invalid JSON or verification token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidJson:
                  $ref: '#/components/examples/InvalidJSON'
                invalidToken:
                  value:
                    error:
                      code: invalid_verification_token
                      message: This verification link is invalid or has expired. Request a new one from your account.
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'

  /api/v1/auth/resend-verification:
    post:
      tags: [Authentication]
      summary: Request a new verification email
      operationId: resendVerification
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Email address is already verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Your email is already verified.
        '202':
          description: Verification email queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Verification email sent.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'

  /api/v1/auth/change-password:
    post:
      tags: [Authentication]
      summary: Change the signed-in user's password
      description: Revokes all refresh sessions and returns replacement tokens for this device.
      operationId: changePassword
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed; replacement tokens returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid JSON or account has no password set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidJson:
                  $ref: '#/components/examples/InvalidJSON'
                passwordNotSet:
                  value:
                    error:
                      code: password_not_set
                      message: This account has no password yet. Use "forgot password" to set one.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Concurrent password change conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: conflict
                  message: Your password was changed by another request. Please sign in again.
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'

  /api/v1/me:
    get:
      tags: [Account]
      summary: Get the authenticated user
      operationId: getMe
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Authenticated user's profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/Timeout'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [ok, unavailable]
    RegisterRequest:
      type: object
      required: [full_name, email, password]
      additionalProperties: false
      properties:
        full_name:
          type: string
          maxLength: 100
          description: Required; trimmed and must not contain control characters.
          example: Feranmi Oresajo
        email:
          type: string
          format: email
          maxLength: 254
          example: fer@example.com
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 128
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: fer@example.com
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 128
    EmailRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: fer@example.com
    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          example: kQ3...
    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      additionalProperties: false
      properties:
        token:
          type: string
        new_password:
          type: string
          format: password
          minLength: 10
          maxLength: 128
    TokenRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 10
          maxLength: 128
          description: Must differ from the current password.
    User:
      type: object
      required: [id, full_name, username, email, email_verified, created_at]
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        created_at:
          type: string
          format: date-time
    TokenResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: Short-lived JWT access token.
        refresh_token:
          type: string
          description: Opaque, single-use refresh token. Store the newest token after rotation.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Access-token lifetime in seconds.
          example: 900
    AuthenticationResponse:
      allOf:
        - $ref: '#/components/schemas/TokenResponse'
        - type: object
          required: [user]
          properties:
            user:
              $ref: '#/components/schemas/User'
    MeResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
  examples:
    InvalidJSON:
      value:
        error:
          code: invalid_json
          message: Request body must be valid JSON with the expected fields.
  responses:
    InvalidJSON:
      description: Malformed JSON, unknown fields, or trailing data.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: invalid_json
              message: Request body must be valid JSON with the expected fields.
    RequestTooLarge:
      description: Request body exceeds 16 KiB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: request_too_large
              message: Request body is too large.
    ValidationFailed:
      description: One or more fields failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: validation_failed
              message: One or more fields are invalid.
              fields:
                email: must be a valid email address
    RateLimited:
      description: Too many requests. Wait before retrying.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: rate_limited
              message: Too many requests. Please try again later.
    Unauthorized:
      description: Missing or invalid access token.
      headers:
        WWW-Authenticate:
          schema:
            type: string
          example: Bearer realm="migo"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: unauthorized
              message: Authentication is required.
    InternalError:
      description: Unexpected server error. Details are not exposed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: internal_error
              message: Something went wrong.
    Timeout:
      description: Request exceeded its deadline.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: timeout
              message: The request timed out.