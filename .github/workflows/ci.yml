name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: migo
          POSTGRES_PASSWORD: migo
          POSTGRES_DB: migo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migo -d migo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Integration tests fail (not skip) in CI if this is missing.
      TEST_DATABASE_URL: postgresql://migo:migo@localhost:5432/migo_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go mod tidy
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./...
